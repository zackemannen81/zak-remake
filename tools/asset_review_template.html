<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zak — assetgranskning</title>
<style>body{margin:0;background:#10151d;color:#e7edf6;font:16px system-ui}header,main{max-width:1500px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{color:#acb9cb;line-height:1.5}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}select,button{background:#243247;color:white;border:1px solid #536780;padding:12px;border-radius:8px;font:inherit}button{cursor:pointer}#asset{min-width:280px;max-width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;background:#080b10;border:1px solid #334155;border-radius:10px;overflow:hidden}figcaption{padding:12px;background:#1b2636}img{display:block;object-fit:contain;width:100%;height:440px}.original{image-rendering:pixelated}#details{padding:18px 0;color:#b9c7dc}a{color:#90cfff}.notice{border-left:3px solid #d7a352;padding-left:12px}#overlay{position:relative;margin-top:16px;background:#000;overflow:hidden;display:none}#overlay img{height:auto;position:absolute;inset:0}#overlay .original{position:relative}label{display:flex;align-items:center;gap:10px;margin:12px 0}input{accent-color:#65baff}footer{padding:24px;color:#93a2b7}@media(max-width:800px){.grid{grid-template-columns:1fr}img{height:300px}}</style>
<header><h1>Zak McKracken · Assetgranskning</h1><p>Originaldata och nya POC-bilder, grupperade per rum och objekt.</p><p class="notice">Genererad bild är ett produktionskoncept. Denna jämförelse bevisar inte korrekt hotspotplacering, animationskontinuitet eller färdig 3D-geometri. Originalens svarta pixlar är opaka.</p></header>
<main><nav><select id="room" aria-label="Rum"></select><select id="asset" aria-label="Resurs"></select><button id="prev">← Föregående</button><button id="next">Nästa →</button><select id="version" aria-label="Bildversion"></select></nav><div id="details"></div><div class="grid"><figure><figcaption>Verifierat original · närmaste pixel</figcaption><img id="original" class="original" alt="Originalbild"></figure><figure><figcaption>Ny POC-version · proportioner bevarade</figcaption><img id="generated" alt="Genererad POC-bild"></figure></div><label><input type="checkbox" id="showOverlay"> Visa diagnostisk överlagring i originalets bildförhållande</label><label id="opacityLabel" hidden>POC-opacitet <input id="opacity" type="range" min="0" max="1" step=".05" value=".5"></label><div id="overlay"><img id="overlayOriginal" class="original" alt="Original i överlagring"><img id="overlayGenerated" alt="POC i överlagring" style="height:100%;opacity:.5"></div><footer id="count"></footer></main>
<script>
const data=__DATA__,el=id=>document.getElementById(id);let filtered=[],current;
function option(value,label){const o=document.createElement('option');o.value=value;o.textContent=label;return o}
for(let r=1;r<=58;r++)el('room').append(option(r,`Rum ${String(r).padStart(3,'0')}`));
function selectRoom(){filtered=data.filter(x=>x.room===Number(el('room').value));el('asset').replaceChildren(...filtered.map((x,i)=>option(i,x.kind==='background'?'Bakgrund':`${x.id} · ${x.name||'(utan namn)'}`)));selectAsset()}
function selectAsset(){current=filtered[Number(el('asset').value)];el('version').replaceChildren(...current.versions.map((p,i)=>option(i,p.split('/').at(-1))));el('version').value=String(current.versions.length-1);el('original').src=current.original;el('overlayOriginal').src=current.original;el('details').textContent=`Rum ${current.room} · ${current.kind==='object'?'Objekt '+current.id+' · ':''}${current.width} × ${current.height} originalpixlar${current.x!==undefined?' · position '+current.x+', '+current.y:''} · ${current.versions.length} sparade versioner`;selectVersion()}
function selectVersion(){const p=current.versions[Number(el('version').value)];for(const id of ['generated','overlayGenerated']){if(p){el(id).src=p;el(id).hidden=false}else{el(id).removeAttribute('src');el(id).hidden=true}}}
el('room').onchange=selectRoom;el('asset').onchange=selectAsset;el('version').onchange=selectVersion;el('prev').onclick=()=>step(-1);el('next').onclick=()=>step(1);function step(d){el('asset').value=String((Number(el('asset').value)+d+filtered.length)%filtered.length);selectAsset()}
el('showOverlay').onchange=()=>{el('overlay').style.display=el('showOverlay').checked?'block':'none';el('opacityLabel').hidden=!el('showOverlay').checked};el('opacity').oninput=()=>el('overlayGenerated').style.opacity=el('opacity').value;
el('count').textContent=`${data.length} resurser · ${data.filter(x=>x.versions.length).length} med POC-bild. Visaren läser lokala filer och ändrar inga assets.`;selectRoom();
</script></html>
